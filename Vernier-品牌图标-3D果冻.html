<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vernier 环境检测 · 品牌图标 3D 果冻原型</title>
<style>
:root, [data-theme="light"]{
  --base:#F0EDE5; --surface:#E7E2D6; --interactive:#DDD6C6; --hairline:#CFC8B8;
  --ink:#1A1A18; --ink2:#6E6A60; --ink3:#8A8578;
  --accent:#C24A00;
  --st-clear:#1E8E3D; --st-warn:#A66A00; --st-danger:#C02820; --st-na:#8A8578;
}
[data-theme="dark"]{
  --base:#12110E; --surface:#1B1915; --interactive:#242019; --hairline:#2B2822;
  --ink:#F2EDE3; --ink2:#A39B8A; --ink3:#7D766A;
  --accent:#FF7A1A;
  --st-clear:#34C759; --st-warn:#FF9F0A; --st-danger:#FF453A; --st-na:#7D766A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Space Grotesk","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#E3E0D8;color:var(--ink);transition:background .3s ease;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 16px 44px;gap:22px;
}
[data-theme="dark"] body{background:#0C0B09}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.stage{display:flex;flex-direction:column;align-items:center;gap:22px}
.phone{
  width:412px;height:892px;flex:none;background:#26241F;border-radius:46px;padding:11px;
  box-shadow:0 24px 70px rgba(20,18,14,.28),0 4px 14px rgba(20,18,14,.18),inset 0 0 0 1.5px rgba(255,255,255,.07);
  position:relative;
}
[data-theme="dark"] .phone{background:#000;box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(255,255,255,.06)}
.screen{position:relative;width:100%;height:100%;background:var(--base);border-radius:36px;overflow:hidden;transition:background .3s;user-select:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:42px;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0}
.statusbar .time{font-size:13.5px;font-weight:600}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar .net{font-size:10px;font-weight:600;color:var(--ink2);letter-spacing:.04em}
.batt{width:22px;height:11px;border:1px solid var(--ink2);border-radius:3.5px;position:relative;opacity:.85}
.batt::after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:var(--ink2)}
.batt i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:68%;border-radius:2px;background:var(--ink2)}
.tabs{position:absolute;top:42px;left:0;right:0;bottom:86px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;z-index:2}
.tabs::-webkit-scrollbar{display:none}
.tabpanel{padding:14px 20px 28px}
/* ---------- 品牌行：3D 图标落在原 mark 位置 ---------- */
.brandrow{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.icon-slot{position:relative;width:96px;height:96px;flex:none;cursor:grab;touch-action:none}
.icon-slot:active{cursor:grabbing}
.icon-slot canvas{width:96px;height:96px;display:block}
.icon-slot img.fallback{width:96px;height:96px;display:block;pointer-events:none}
.icon-slot img.fallback[hidden]{display:none !important}
.icon-hint{
  position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
  font-size:10px;color:var(--ink3);white-space:nowrap;letter-spacing:.04em;
  opacity:1;transition:opacity .4s;pointer-events:none;
}
.icon-slot.touched .icon-hint{opacity:0}
.wordmark{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.wordmark b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.wordmark span{font-size:14px;color:var(--ink2);margin-top:2px}
.textbtn{border:0;background:transparent;color:var(--ink);font:600 14px/1 "Space Grotesk","Noto Sans SC",sans-serif;padding:8px 2px;cursor:pointer;transition:opacity .15s}
.textbtn:active{opacity:.45}
/* ---------- 状态句 ---------- */
.verdict{font-size:27px;font-weight:600;line-height:1.32;letter-spacing:-.02em;margin-bottom:16px;min-height:71px}
.hl-danger{color:var(--st-danger)}
/* ---------- 刻度尺 ---------- */
.scalerow{display:flex;align-items:baseline;justify-content:space-between}
.scalelabel{font-size:12px;color:var(--ink2)}
.count{font-size:13px;font-weight:500;color:var(--ink3)}
.ruler{position:relative;height:62px;margin:6px 0 22px}
.majors div{position:absolute;bottom:38px;width:1px;height:8px;background:var(--hairline)}
.majors div.m5{bottom:38px;height:16px;width:1.5px;background:var(--ink3)}
.mlabel{position:absolute;bottom:22px;font-size:9px;font-weight:500;color:var(--ink3);transform:translateX(-50%);white-space:nowrap}
.vernier div{position:absolute;bottom:9px;width:1px;height:5px;background:var(--ink3)}
.vernier div.v5{height:9px}
.cursor{position:absolute;bottom:7px;width:3px;height:46px;border-radius:2px;background:var(--ink);transform:translateX(-1.5px)}
/* ---------- 测量组 ---------- */
.sectionrow{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.sectionrow span{font-size:13px;color:var(--ink2)}
.groups{display:flex;flex-direction:column;gap:8px}
.group{position:relative;border-radius:16px;background:var(--surface)}
.grow{display:flex;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:13px 15px;border-radius:16px;gap:12px;font-family:inherit;cursor:default}
.gtext{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.gname{font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.gdesc{font-size:11.5px;color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcount{font-size:12.5px;font-weight:500;color:var(--ink3);flex:none;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:var(--st-clear)}
.dot.warn{background:var(--st-warn)}
.dot.danger{background:var(--st-danger)}
/* ---------- 底部导航 ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;z-index:5;display:flex;background:var(--base);border-top:1px solid var(--hairline);transition:background .3s}
.tabind{position:absolute;top:10px;left:2px;width:calc(100%/3 - 4px);height:36px;border-radius:12px;background:var(--interactive)}
.tab{flex:1;border:0;background:transparent;height:56px;font:500 13.5px/1 "Space Grotesk","Noto Sans SC",sans-serif;color:var(--ink3);position:relative;z-index:1;transition:color .25s;padding-top:19px}
.tab.on{color:var(--ink);font-weight:600}
/* ---------- 物理开关 ---------- */
.phys-toggle{
  position:absolute;right:20px;bottom:104px;z-index:6;
  display:flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:999px;
  padding:7px 13px;font-size:11.5px;font-weight:500;color:var(--ink2);cursor:pointer;
}
.phys-toggle .led{width:7px;height:7px;border-radius:50%;background:var(--st-clear)}
.phys-toggle.off .led{background:var(--ink3)}
/* ---------- 说明 ---------- */
.caption{max-width:560px;text-align:center;color:#6E6A60}
[data-theme="dark"] .caption{color:#A39B8A}
.caption .c1{font-size:13.5px;font-weight:600}
.caption .c2{font-size:12px;margin-top:6px;line-height:1.7;opacity:.85}
.caption .c2 code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
[data-theme="dark"] .caption .c2 code{background:rgba(255,255,255,.08)}
@media (max-width:460px){.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-90px}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span class="time mono">9:41</span>
        <div class="right"><span class="net mono">5G</span><span class="batt"><i></i></span></div>
      </div>

      <div class="tabs">
        <section class="tabpanel">
          <header class="brandrow">
            <div class="icon-slot" id="iconSlot" title="拖我">
              <img class="fallback" id="iconFallback" alt="Vernier 品牌图标" hidden>
              <span class="icon-hint">拖我 · 果冻</span>
            </div>
            <div class="wordmark">
              <b>Vernier</b>
              <span id="subline">环境检测</span>
            </div>
            <button class="textbtn" id="langBtn">EN</button>
          </header>

          <p class="verdict" id="verdict">18 项检测完成，<span class="hl-danger">1 项危险</span>，1 项需注意</p>

          <div class="scalerow">
            <span class="scalelabel">扫描进度</span>
            <span class="count mono" id="count">18 / 18</span>
          </div>
          <div class="ruler" id="ruler">
            <div class="majors" id="majors"></div>
            <div class="vernier" id="vernierTicks"></div>
            <div class="cursor" id="cursor" style="left:100%"></div>
          </div>

          <div class="sectionrow"><span>测量组</span><span style="font-size:12px;color:var(--ink3)">按严重度排序</span></div>
          <div class="groups" id="groups"></div>
        </section>
      </div>

      <div class="phys-toggle" id="physToggle"><span class="led"></span><span id="physLabel">果冻物理 开</span></div>

      <div class="tabbar">
        <div class="tabind"></div>
        <button class="tab on">测量</button>
        <button class="tab">记录</button>
        <button class="tab">设置</button>
      </div>
    </div>
  </div>
  <div class="caption">
    <div class="c1">Vernier 品牌图标 · Blender 3D 原型</div>
    <div class="c2">深墨阳极氧化仪器面 + 奶油刻度嵌线 + 信号橙滑动标。<code>XPBD</code> 形状匹配果冻物理（147 粒子点阵），可拖拽、可甩动，松手回弹归位。图标落在原版文字位置（品牌行 mark 槽）。</div>
  </div>
</div>

  function b64ToU8(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);

      // glTF primitives are indexed: walk the index so triangles survive the merge.
      const nRefs = idx ? idx.count : pos.count;
      const groups = geo.groups && geo.groups.length ? geo.groups : [{ start: 0, count: nRefs, materialIndex: 0 }];
      for (const g of groups) {
        const mat = Array.isArray(child.material) ? child.material[g.materialIndex || 0] : child.material;
        const col = COLOR_BY_MATERIAL[mat && mat.name] || 0x888888;
        meshMat.setHex(col);
        for (let i = g.start; i < g.start + g.count; i++) {
          const vi = idx ? idx.getX(i) : i;
          const v = new THREE.Vector3().fromBufferAttribute(pos, vi).applyMatrix4(child.matrixWorld);
          positions.push(v.x, v.y, v.z);
          const n = nor ? new THREE.Vector3().fromBufferAttribute(nor, vi).applyMatrix3(nm).normalize() : new THREE.Vector3(0, 0, 1);
          normals.push(n.x, n.y, n.z);
          colors.push(meshMat.r, meshMat.g, meshMat.b);
          bodyFlags.push(isBody);
        }
      }
    });

    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    merged.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    merged.setAttribute('isBody', new THREE.Float32BufferAttribute(bodyFlags, 1));
    // glTF is Y-up: the Blender slab stands face-toward +Y. Tip it +90 deg on X so the
    // instrument face looks at the camera, then rebuild bounds and simulate the tipped shape.
    merged.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
    // Weld the merged primitives into an INDEXED geometry: on a non-indexed buffer every
    // triangle gets its own normal, and computeVertexNormals() then bands the whole face.
    const welded = mergeVertices(merged, 1e-4);
    welded.computeBoundingBox();
    const simGeo = welded;

    const material = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      roughness: 0.42,
      metalness: 0.28,
      clearcoat: 0.45,
      clearcoatRoughness: 0.32,
      envMapIntensity: 1.0,
    });
    const mesh = new THREE.Mesh(simGeo, material);
    scene.add(mesh);
    setupJelly(simGeo);
    window.__vernier = { mesh: true, verts: simGeo.attributes.position.count };
  }, (err) => {
    console.error('GLB parse failed', err);
    showFallback();
  });

  /* ---------- XPBD 果冻：形状匹配点阵 ---------- */
  let particles = null;
  let restLocal = null;
  let edges = [];
  let bindWeights = null;   // per-vertex: [{i, w}]
  let origPos = null;       // Float32Array: original (welded) vertex positions
  let grabbed = -1;
  let grabTarget = new THREE.Vector3();
  let lastGrabVel = new THREE.Vector3();
  // 邻域加权软抓取：一次带动一小片粒子（保持局部形状），而不是把单颗粒子硬钉在指针上。
  // 单点硬 pin 拉到极限时会和距离约束来回拉锯 —— 那正是"拉到底发抖"的来源。
  let grabW = null;             // per-particle grab weight, 0 = not grabbed
  let grabAnchor = null;        // per-particle rest offset from the grabbed centre
  let clockT = 0;

  function setupJelly(geo) {
    const bb = geo.boundingBox;
    const posAttr = geo.attributes.position;
    const bodyAttr = geo.attributes.isBody;

    // Skinning model: vertices = rigid transform of the ORIGINAL mesh + elastic offset
    // interpolated from the lattice. The lattice itself is a plain regular grid (the cap
    // faces carry only outline verts, so vertex-derived lattices go hollow).
    origPos = Float32Array.from(posAttr.array);

    const NX = 11, NY = 11, NZ = 3;
    const sx = (bb.max.x - bb.min.x) / NX;
    const sy = (bb.max.y - bb.min.y) / NY;
    let bzlo = Infinity, bzhi = -Infinity;
    for (let vi = 0; vi < posAttr.count; vi++) {
      if (bodyAttr && bodyAttr.getX(vi) < 0.5) continue;
      const z = posAttr.getZ(vi);
      if (z < bzlo) bzlo = z;
      if (z > bzhi) bzhi = z;
    }

    particles = [];
    restLocal = [];
    const cell = [];   // cell[iy][ix][iz] = particle index
    for (let iy = 0; iy < NY; iy++) {
      cell.push([]);
      for (let ix = 0; ix < NX; ix++) {
        cell[iy].push([]);
        const cx = bb.min.x + sx * (ix + 0.5);
        const cy = bb.min.y + sy * (iy + 0.5);
        for (let iz = 0; iz < NZ; iz++) {
          const z = bzlo + (bzhi - bzlo) * (iz / (NZ - 1));
          const p = new THREE.Vector3(cx, cy, z);
          cell[iy][ix].push(particles.length);
          particles.push({ p: p.clone(), prev: p.clone(), v: new THREE.Vector3() });
          restLocal.push(p.clone());
        }
      }
    }

    const link = (a, b) => {
      if (a < 0 || b < 0 || a === b) return;
      const d = particles[a].p.distanceTo(particles[b].p);
      if (d < 1e-6) return;
      edges.push([a, b, d]);
    }
    window.__dbgSetup = {
      n: particles.length, edges: edges.length,
      bb: [bb.min.x, bb.max.x, bb.min.y, bb.max.y, bb.min.z, bb.max.z].map(v => +v.toFixed(3)),
    };
    for (let iy = 0; iy < NY; iy++) {
      for (let ix = 0; ix < NX; ix++) {
        for (let iz = 0; iz < NZ; iz++) {
          const a = cell[iy][ix][iz];
          if (a < 0) continue;
          if (ix + 1 < NX) link(a, cell[iy][ix + 1][iz]);
          if (iy + 1 < NY) link(a, cell[iy + 1][ix][iz]);
          if (iz + 1 < NZ) link(a, cell[iy][ix][iz + 1]);
          // face diagonals resist shear so the slab wobbles as one piece
          if (ix + 1 < NX && iy + 1 < NY) {
            link(a, cell[iy + 1][ix + 1][iz]);
            link(cell[iy][ix + 1][iz], cell[iy + 1][ix][iz]);
          }
          if (ix + 1 < NX && iz + 1 < NZ) link(a, cell[iy][ix + 1][iz + 1]);
          if (iy + 1 < NY && iz + 1 < NZ) link(a, cell[iy + 1][ix][iz + 1]);
        }
      }
    }

    restWorld.length = 0;
    for (let i = 0; i < particles.length; i++) restWorld.push(new THREE.Vector3());

    // vertex -> lattice binding: K nearest with GAUSSIAN weights (finite at d=0, so no
    // vertex gets pinned to a single particle). The weights only carry the ELASTIC
    // offset; the rigid part keeps every vertex glued to the original surface.
    bindWeights = new Array(posAttr.count);
    const K = 8;
    const tmp = new THREE.Vector3();
    for (let vi = 0; vi < posAttr.count; vi++) {
      tmp.fromBufferAttribute(posAttr, vi);
      const scored = [];
      for (let pi = 0; pi < particles.length; pi++) {
        scored.push([pi, tmp.distanceToSquared(particles[pi].p)]);
      }
      scored.sort((a, b) => a[1] - b[1]);
      const reach = Math.max(scored[K - 1][1], 0.02);
      // wider falloff = deformation spreads across the slab instead of staying a dent
      const sigma2 = reach * 0.5;
      let wsum = 0;
      const list = [];
      for (let k = 0; k < K; k++) {
        const w = Math.exp(-scored[k][1] / sigma2);
        wsum += w;
        list.push([scored[k][0], w]);
      }
      for (const it of list) it[1] /= wsum;
      bindWeights[vi] = list;
    }
  }

  // home transform: slot pose + idle sway
  const homeQuat = new THREE.Quaternion();
  const restWorld = [];
  const curHome = new THREE.Vector3();
  // Keep the tilt small: a steep yaw collapses the z gap between a column's top and
  // bottom shell, which the distance constraints then fight back against (self-excited
  // oscillation). The camera already provides the 3/4 view.
  function homePose(t) {
    const sway = REDUCED ? 0 : Math.sin(t * 0.55) * 0.03;
    const bob = REDUCED ? 0 : Math.sin(t * 0.8 + 1.3) * 0.02;
    homeQuat.setFromEuler(new THREE.Euler(0.04 + sway * 0.25, -0.06 + sway * 0.6, 0, 'YXZ'));
    return curHome.set(bob * 0.3, bob, 0);
  }

  // 果冻动力学：力驱动弹簧（会过冲 = 弹）+ 距离约束（保形）
  // K 越大回弹越快越硬，C 越小晃动越久。临界阻尼 = 2*sqrt(K)，远小于临界才有"果冻弹"。
  const SUB = 8;
  const FRAME = 1 / 60;
  // 果冻（软、慢、余波长）vs 橡胶（硬、快、弹完就停）：
  // 刚度降下来 = 更容易被拉出形变；阻尼降下来 = 松手后多晃几下才停。
  const K_SPRING = 240;      // 回弹刚度 -> 固有频率 sqrt(240)=15.5 rad/s ≈ 2.5 Hz
  const C_DAMP = 3.4;        // 阻尼 -> ζ ≈ 0.11，松手后晃 3~4 下
  const CONSTRAINT_ITER = 2;
  const EDGE_STIFF = 0.5;    // 距离约束修正量：保持偏高 = 整块一起晃（果冻），而不是局部凹陷（软泥）
  const HOME_PULL_IDLE = 0.045;
  const HOME_PULL_DRAG = 0.004;
  // 拖拽手感
  const DRAG_K_SCALE = 0.16; // 拖拽时回弹刚度打折 -> 拉起来省力（"太难拉"的直接解药）
  const GRAB_K = 430;        // 软抓取弹簧：够跟手，但超限时是"拉不动"而不是"抖"
  const GRAB_DAMP = 0.22;    // 抓取粒子额外阻尼（每子步），吃掉极限拉锯的残余能量
  const MAX_SPEED = 7.0;     // 速度钳制：数值兜底，杜绝任何自激发散
  const MAX_CORR = 0.05;     // 单条约束单子步最大修正量：防止约束过冲抖动

  const _force = new THREE.Vector3();
  const _tmp = new THREE.Vector3();
  const grabPrev = new THREE.Vector3();
  let grabPrevValid = false;

  function step(homePos) {
    const dt = FRAME / SUB;
    const dampMul = Math.max(0, 1 - C_DAMP * dt);
    for (let i = 0; i < particles.length; i++) {
      restWorld[i].copy(restLocal[i]).applyQuaternion(homeQuat).add(homePos);
    }
    if (grabbed >= 0 && !grabPrevValid) { grabPrev.copy(particles[grabbed].p); grabPrevValid = true; }

    const kNow = grabbed >= 0 ? K_SPRING * DRAG_K_SCALE : K_SPRING;
    const grabbing = grabbed >= 0 && grabW !== null;

    for (let s = 0; s < SUB; s++) {
      for (let i = 0; i < particles.length; i++) {
        const pt = particles[i];
        // 弹簧回复力：欠阻尼 → 过冲 → 来回摆动
        _force.copy(restWorld[i]).sub(pt.p).multiplyScalar(kNow * dt);
        pt.v.add(_force);
        pt.v.multiplyScalar(dampMul);
        if (grabbing && grabW[i] > 0) {
          // 软抓取：目标 = 指针位置 + 该粒子相对抓取中心的静止偏移（旋转跟随）。
          // 用弹簧而不是硬设位置 —— 拉到极限时表现为"拉不动"，而不是与约束共振发抖。
          _tmp.copy(grabAnchor[i]).applyQuaternion(homeQuat).add(grabTarget);
          pt.v.addScaledVector(_tmp.sub(pt.p), GRAB_K * grabW[i] * dt);
          pt.v.multiplyScalar(1 - GRAB_DAMP * grabW[i]);
        }
        const sp = pt.v.length();
        if (sp > MAX_SPEED) pt.v.multiplyScalar(MAX_SPEED / sp);
        pt.p.addScaledVector(pt.v, dt);
      }
      for (let it = 0; it < CONSTRAINT_ITER; it++) {
        for (const [a, b, len] of edges) {
          const pa = particles[a].p, pb = particles[b].p;
          const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z;
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
          let move = (d - len) * EDGE_STIFF;
          if (move > MAX_CORR) move = MAX_CORR; else if (move < -MAX_CORR) move = -MAX_CORR;
          const corr = move / d;
          // grabbed particles act near-infinite-mass: constraints move mainly their
          // neighbours, so the drag actually pulls the slab along instead of ping-ponging.
          const wa = grabbing ? grabW[a] : 0, wb = grabbing ? grabW[b] : 0;
          const ia = wa > 0.5 ? 0.08 : 1, ib = wb > 0.5 ? 0.08 : 1;
          const sum = ia + ib;
          const ha = ia / sum, hb = ib / sum;
          pa.x += dx * corr * ha; pa.y += dy * corr * ha; pa.z += dz * corr * ha;
          pb.x -= dx * corr * hb; pb.y -= dy * corr * hb; pb.z -= dz * corr * hb;
        }
      }
    }
    // Gauss-Seidel keeps a residual drift away from the rest shape; pull the lattice
    // back a little every frame so the idle state stays clean (no shading bands).
    // While grabbed, let the jelly stretch freely instead of fighting the drag.
    const HOME_PULL = grabbed >= 0 ? HOME_PULL_DRAG : HOME_PULL_IDLE;
    for (let i = 0; i < particles.length; i++) {
      particles[i].p.lerp(restWorld[i], HOME_PULL);
    }
    // 甩动速度：用真实位移 / 真实时间（之前按子步反算被低估 6 倍，弹不起来）
    if (grabbed >= 0) {
      lastGrabVel.copy(particles[grabbed].p).sub(grabPrev).multiplyScalar(1 / FRAME);
      grabPrev.copy(particles[grabbed].p);
    } else {
      grabPrevValid = false;
    }
  }

  const _sv = new THREE.Vector3();
  function applyToGeometry(geo) {
    const posAttr = geo.attributes.position;
    // Linear-blend skinning on top of the rigid home pose:
    //   vertex = R(t)*orig + t + Σ w_i * (p_i - (R(t)*rest_i + t))
    // With zero elastic offset every vertex sits EXACTLY on the rigid mesh, so the
    // idle state keeps factory-smooth normals (no shading bands from lattice ripple).
    for (let vi = 0; vi < posAttr.count; vi++) {
      _sv.set(origPos[vi * 3], origPos[vi * 3 + 1], origPos[vi * 3 + 2])
        .applyQuaternion(homeQuat).add(curHome);
      let dx = 0, dy = 0, dz = 0;
      const list = bindWeights[vi];
      for (const [pi, w] of list) {
        const pt = particles[pi], rw = restWorld[pi];
        dx += (pt.p.x - rw.x) * w;
        dy += (pt.p.y - rw.y) * w;
        dz += (pt.p.z - rw.z) * w;
      }
      posAttr.setXYZ(vi, _sv.x + dx, _sv.y + dy, _sv.z + dz);
    }
    posAttr.needsUpdate = true;
    geo.computeVertexNormals();
  }

  /* ---------- 拖拽交互 ---------- */
  // Grab a small patch around the hit particle, each with its own weight and its rest
  // offset from the centre. Dragging a patch (local shape preserved) instead of pinning a
  // single particle is what kills the judder at full stretch: there is no longer one point
  // fighting the whole constraint network.
  function buildGrab(center) {
    grabW = new Float32Array(particles.length);
    grabAnchor = new Array(particles.length).fill(null);
    const c = restLocal[center];
    const sigma2 = 2 * 0.34 * 0.34;
    for (let i = 0; i < particles.length; i++) {
      const d = restLocal[i].distanceTo(c);
      if (d > 0.80) continue;
      const w = Math.exp(-(d * d) / sigma2);
      if (w < 0.05) continue;
      grabW[i] = w;
      grabAnchor[i] = restLocal[i].clone().sub(c);
    }
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const dragPlane = new THREE.Plane();
  let meshRef = null;
  const origTraverse = scene.traverse.bind(scene);

  function pointerToWorld(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = new THREE.Vector3();
    if (meshRef && raycaster.ray.intersectPlane(dragPlane, hit)) return hit;
    return null;
  }

  slot.addEventListener('pointerdown', (ev) => {
    if (!physOn || !meshRef) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(meshRef, false);
    if (!hits.length) return;
    const hp = hits[0].point.clone();
    // drag plane: through hit point, facing the camera
    const n = camera.getWorldDirection(new THREE.Vector3()).negate();
    dragPlane.setFromNormalAndCoplanarPoint(n, hp);
    // nearest lattice particle
    let best = 0, bd = Infinity;
    for (let i = 0; i < particles.length; i++) {
      const d = particles[i].p.distanceToSquared(hp);
      if (d < bd) { bd = d; best = i; }
    }
    grabbed = best;
    buildGrab(best);
    grabTarget.copy(hp);
    slot.setPointerCapture(ev.pointerId);
    slot.classList.add('touched');
    ev.preventDefault();
  });

  slot.addEventListener('pointermove', (ev) => {
    if (grabbed < 0) return;
    const w = pointerToWorld(ev);
    if (w) grabTarget.copy(w);
  });

  function release(ev) {
    if (grabbed < 0) return;
    // 甩出：把拖拽速度还给它，并给被抓的那一小片一点冲量 → 整块一起抖
    particles[grabbed].v.copy(lastGrabVel).multiplyScalar(1.15);
    for (let i = 0; i < particles.length; i++) {
      if (i === grabbed || !grabW || grabW[i] <= 0) continue;
      particles[i].v.addScaledVector(lastGrabVel, 0.6 * grabW[i]);
    }
    grabbed = -1;
    grabW = null;
    grabPrevValid = false;
    if (ev && ev.pointerId !== undefined && slot.hasPointerCapture(ev.pointerId)) {
      slot.releasePointerCapture(ev.pointerId);
    }
  }
  slot.addEventListener('pointerup', release);
  slot.addEventListener('pointercancel', release);

  // #demo: an automatic drag so the jelly can be seen (and tested) without a pointer.
  if (location.hash.indexOf('demo') >= 0) {
    setTimeout(() => {
      if (!particles || grabbed >= 0) return;
      const hp = new THREE.Vector3(0, 0, 0.3);
      let best = 0, bd = Infinity;
      for (let i = 0; i < particles.length; i++) {
        const d = particles[i].p.distanceToSquared(hp);
        if (d < bd) { bd = d; best = i; }
      }
      grabbed = best;
      buildGrab(best);
      slot.classList.add('touched');
      const t0 = performance.now();
      const demoMove = (now) => {
        const t = (now - t0) / 1000;
        window.__demoT = t;
        if (t < 2.6 && grabbed >= 0) {
          // 前 1.0s 拉到极限，之后原地保持 —— 专门压测"拉到底不动时会不会发抖"
          const a = Math.min(1, t / 1.0);
          const e = a * a * (3 - 2 * a);
          grabTarget.set(0.95 * e, 0.62 * e, 0.3);
          requestAnimationFrame(demoMove);
        } else {
          window.__demoT = -t;
          release();
        }
      };
      requestAnimationFrame(demoMove);
    }, 1200);
  }

  // expose mesh once loaded
  const checkMesh = setInterval(() => {
    scene.traverse((o) => { if (o.isMesh && o.geometry.attributes.color) meshRef = o; });
    if (meshRef) clearInterval(checkMesh);
  }, 100);

  window.__dbgJelly = function () {
    const out = { particles: particles.length, edges: edges.length, verts: meshRef ? meshRef.geometry.attributes.position.count : 0 };
    let mx = 0;
    for (let i = 0; i < particles.length; i++) mx = Math.max(mx, particles[i].p.distanceTo(restLocal[i]));
    out.maxDevFromRest = +mx.toFixed(4);
    if (meshRef) {
      const g = meshRef.geometry;
      const p = g.attributes.position, ib = g.attributes.isBody;
      let bz0 = 1e9, bz1 = -1e9, mz0 = 1e9, mz1 = -1e9, bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        if (ib && ib.getX(i) > 0.5) {
          if (z < bz0) bz0 = z; if (z > bz1) bz1 = z;
          if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
          if (y < by0) by0 = y; if (y > by1) by1 = y;
        } else {
          if (z < mz0) mz0 = z; if (z > mz1) mz1 = z;
        }
      }
      out.bodyZ = [+bz0.toFixed(3), +bz1.toFixed(3)];
      out.marksZ = [+mz0.toFixed(3), +mz1.toFixed(3)];
      out.bodyXY = [+bx0.toFixed(3), +bx1.toFixed(3), +by0.toFixed(3), +by1.toFixed(3)];
      const zs = [];
      for (let i = 0; i < Math.min(6, particles.length); i++) zs.push(+particles[i].p.z.toFixed(3));
      out.firstParticleZ = zs;
      // sample top-face body verts: mean z per y-bin (detects row-wise ripple)
      const BINS = 14, ylo = by0, yspan = by1 - by0;
      const acc = new Array(BINS).fill(0), cnt = new Array(BINS).fill(0);
      for (let i = 0; i < p.count; i++) {
        if (!(ib && ib.getX(i) > 0.5)) continue;
        const z = p.getZ(i);
        if (z < 0.18) continue;                     // top shell only
        const b = Math.max(0, Math.min(BINS - 1, Math.floor((p.getY(i) - ylo) / yspan * BINS)));
        acc[b] += z; cnt[b]++;
      }
      out.topZbyRow = acc.map((s, i) => cnt[i] ? +(s / cnt[i]).toFixed(4) : null);
      out.rowCounts = cnt;
    }
    return out;
  };

  /* ---------- 物理开关 ---------- */
  const physToggle = document.getElementById('physToggle');
  const physLabel = document.getElementById('physLabel');
  physToggle.addEventListener('click', () => {
    physOn = !physOn;
    physToggle.classList.toggle('off', !physOn);
    physLabel.textContent = physOn ? I18N[lang].physOn : I18N[lang].physOff;
    if (!physOn && meshRef) {
      // snap back home instantly (keep restWorld in sync: it feeds the skinning base)
      const home = homePose(clockT);
      for (let i = 0; i < particles.length; i++) {
        const rl = restLocal[i].clone().applyQuaternion(homeQuat).add(home);
        restWorld[i].copy(rl);
        particles[i].p.copy(rl);
        particles[i].prev.copy(rl);
        particles[i].v.set(0, 0, 0);
      }
      applyToGeometry(meshRef.geometry);
    }
  });

  /* ---------- 主循环 ---------- */
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    try {
      const dtms = Math.min(now - last, 50);
      last = now;
      clockT += dtms / 1000;
      if (meshRef) {
        const home = homePose(clockT);
        if (physOn) step(home);
        applyToGeometry(meshRef.geometry);
      }
      renderer.render(scene, camera);
    } catch (err) {
      console.error('loop error', err);
    }
  }
  requestAnimationFrame(loop);
} else {
  showFallback();
}
</script>
</body>
</html>
